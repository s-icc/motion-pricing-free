name: Publish Free package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - run: npm ci
      - run: npm run validate
      - name: Publish Core when its version is new
        run: |
          CORE_VERSION=$(node -p "require('./packages/core/package.json').version")
          npm view "@motion-pricing/core@$CORE_VERSION" version >/dev/null 2>&1 || npm publish -w @motion-pricing/core --access public
      - run: npm publish -w @motion-pricing/free --access public
